name: SENDAS mobile and narrative QA
on:
  pull_request:
  push:
    branches:
      - main
      - 'development/**'
jobs:
  browser:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Check JS and static resources
        run: |
          python3 tests/test_static.py
          for f in game.js core20.js shared-ui21.js chapter18.js codex15.js chapter16.js echoes17.js ambient.js sw.js; do
            test ! -f "$f" || node --check "$f"
          done
          node tests/test_core20.cjs
          node tests/test_sim20.cjs
      - name: Install Chromium and Playwright
        run: |
          npm install --no-save playwright@1.56.1
          npx playwright install --with-deps chromium
      - name: Browser tests with local static server
        run: |
          python3 -m http.server 8777 --bind 127.0.0.1 >/tmp/sendas-http.log 2>&1 &
          node tests/test_e2e.mjs
      - uses: actions/upload-artifact@v4
        if: success()
        with:
          name: sendas-2.1-mobile-panels
          path: tests/screenshots/unified-*.png
          if-no-files-found: ignore
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: sendas-qa-failures
          path: |
            tests/screenshots/
            /tmp/sendas-http.log
          if-no-files-found: ignore
